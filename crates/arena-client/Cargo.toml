[package]
name = "arena-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The client of arena, which draws the world as characters."

[dependencies]
arena-sim = { path = "../arena-sim" }
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"
wgpu = "30"
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ab_glyph = "0.2"
fontdb = "0.24"
pollster = "1"

# A browser gives the glyphs through a canvas and the graphics adapter only to a future. Its
# adapter comes from WebGPU, else from WebGL2.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlElement",
  "ImageData",
  "Node",
  "TextMetrics",
  "Window",
] }
wgpu = { version = "30", features = ["webgl"] }

# The tests of the glyphs of a browser run in a headless browser, which wasm-bindgen-test drives.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
