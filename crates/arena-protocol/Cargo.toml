[package]
name = "arena-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The messages between a client and the server of arena, and their codec, with no socket and no runtime."

[dependencies]
arena-sim = { path = "../arena-sim" }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[lints]
workspace = true
